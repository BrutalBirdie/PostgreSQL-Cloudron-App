[program:postgresql]
priority=10
command=/usr/lib/postgresql/18/bin/postgres -c config_file=/run/pg/postgresql.conf
user=postgres
autostart=true
autorestart=true
; SIGINT is the fast shutdown mode, SIGTERM would wait for all clients to disconnect
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
