{{define "content"}}
<h1>Audit log</h1>
<table>
  <thead><tr><th>Time (UTC)</th><th>User</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead>
  <tbody>
  {{range .Data}}
  <tr><td>{{.At.UTC.Format "2006-01-02 15:04:05"}}</td><td>{{.Actor}}</td><td>{{.Action}}</td><td><code>{{.Target}}</code></td><td>{{.Detail}}</td></tr>
  {{else}}
  <tr><td colspan="5">No entries.</td></tr>
  {{end}}
  </tbody>
</table>
{{end}}
