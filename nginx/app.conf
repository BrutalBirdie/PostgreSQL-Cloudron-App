server {
    listen 8000 default_server;
    server_name _;
    absolute_redirect off;

    root /app/code/www;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # the panel serves /admin from Phase 2 on
    location = /admin {
        return 302 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
